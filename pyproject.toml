[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lexlocal"
version = "0.1.0"
description = "Local-first legal document intelligence desktop application."
requires-python = ">=3.11,<3.12"
dependencies = [
    "foundry-local-sdk>=1.2.3",
    "pyside6>=6.11.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lexlocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["lexlocal"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
